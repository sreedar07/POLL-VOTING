services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks: [internal]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    networks: [internal]

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 8080
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: pulsepoll
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      - mongo
      - redis
    networks: [internal]

  frontend:
    build: ./frontend
    restart: unless-stopped
    networks: [internal]

networks:
  internal:

volumes:
  mongo_data:
