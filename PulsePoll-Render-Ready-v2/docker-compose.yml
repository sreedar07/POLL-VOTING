services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:8-alpine
    restart: unless-stopped

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 8080
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: pulsepoll
      REDIS_ADDR: redis:6379
      JWT_SECRET: change-this-in-development
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      - mongo
      - redis
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  mongo_data:
